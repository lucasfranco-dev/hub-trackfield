name: Publicar no Apps Script

# Toda alteração em src/ que chega na main vai para o Apps Script
# e atualiza a implantação do app da Web (a URL continua a mesma).
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.clasp.json'
      - 'scripts/publicar.sh'
  workflow_dispatch:

concurrency:
  group: publicar-apps-script
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Credenciais do clasp
        id: credenciais
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::warning::Publicação pulada: falta o segredo CLASPRC_JSON (veja o README, seção Publicação)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Enviar e atualizar a implantação
        if: steps.credenciais.outputs.ok == 'true'
        run: sh scripts/publicar.sh
