name: Publicar no Apps Script

# Toda alteração em src/ que chega na main vai para o Apps Script
# e atualiza a implantação do app da Web (a URL continua a mesma).
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.clasp.json'
      - 'scripts/publicar.sh'
  workflow_dispatch:

concurrency:
  group: publicar-apps-script
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Credenciais do clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Cadastre o segredo CLASPRC_JSON (veja o README, seção Publicação automática)."
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Enviar e atualizar a implantação
        env:
          DEPLOYMENT_ID: ${{ vars.DEPLOYMENT_ID }}
        run: sh scripts/publicar.sh
