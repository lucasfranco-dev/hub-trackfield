<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storyboard Hub Vitrine</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f1ec; --ink:#2a2622; --muted:#7a7168; --card:#fff; --line:#ddd5cb;
    --wood:#a87650; --wood-d:#7e5536; --greige:#b9b2a8; --warm:#f6eee2; --accent:#d9682b;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#171513; --ink:#efe9e2; --muted:#a59a8e; --card:#221f1c; --line:#3a342e; }
  }
  :root[data-theme="dark"]{ --bg:#171513; --ink:#efe9e2; --muted:#a59a8e; --card:#221f1c; --line:#3a342e; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;line-height:1.5}
  main{max-width:1100px;margin:0 auto;padding:32px 16px 64px}
  h1{font-size:28px;margin:0 0 4px;font-weight:800;letter-spacing:-.02em}
  .sub{color:var(--muted);margin:0 0 28px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}
  figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  figure svg{display:block;width:100%;height:auto}
  figcaption{padding:12px 16px 16px;font-size:14px}
  figcaption b{display:block;font-size:15px;margin-bottom:2px}
  .wide{grid-column:1/-1}
  .mobile-wrap{display:flex;justify-content:center;background:#e9e3da;padding:20px 0}
  .mobile-wrap svg{width:200px}
  .note{margin-top:24px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>Hub da Vitrine: storyboard</h1>
  <p class="sub">Esboço de conceito, sem fidelidade final. Os nomes dos links são exemplos.</p>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <pattern id="slats" width="7" height="10" patternUnits="userSpaceOnUse">
        <rect width="7" height="10" fill="#7e5536"/><rect width="5" height="10" fill="#a87650"/>
      </pattern>
      <linearGradient id="interior" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fffaf2"/><stop offset=".75" stop-color="#f3e7d6"/><stop offset="1" stop-color="#c79a6c"/>
      </linearGradient>
      <radialGradient id="spot" cx=".5" cy="0" r=".9">
        <stop offset="0" stop-color="#fff6e3" stop-opacity=".95"/><stop offset="1" stop-color="#fff6e3" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".48" stop-color="#fff" stop-opacity="0"/>
        <stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset=".56" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <symbol id="mq" viewBox="0 0 40 130">
        <ellipse cx="20" cy="9" rx="6.5" ry="8.5" fill="#8f8f8f"/>
        <rect x="17.5" y="16" width="5" height="6" fill="#8f8f8f"/>
        <path d="M8 24 Q20 20 32 24 L34 60 L31 62 L30 30 L29 60 L11 60 L10 30 L9 62 L6 60 Z" fill="#8f8f8f"/>
        <path d="M11 60 L29 60 L28 118 L22 118 L20 70 L18 118 L12 118 Z" fill="#8f8f8f"/>
        <rect x="11" y="117" width="8" height="5" rx="2" fill="#f2f2f2"/><rect x="21" y="117" width="8" height="5" rx="2" fill="#f2f2f2"/>
        <rect x="6" y="124" width="28" height="3" fill="#9a9a9a"/>
      </symbol>
      <symbol id="top" viewBox="0 0 40 130">
        <path d="M7 24 Q20 19 33 24 L35 58 L30 59 L29.5 32 L29 62 L11 62 L10.5 32 L10 59 L5 58 Z" fill="currentColor"/>
      </symbol>
      <symbol id="bottom" viewBox="0 0 40 130">
        <path d="M11 60 L29 60 L28.5 116 L22 116 L20 72 L18 116 L11.5 116 Z" fill="currentColor"/>
      </symbol>
    </defs>
  </svg>

  <div class="grid">
    <figure>
      <svg viewBox="0 0 480 300" role="img" aria-label="Fachada da loja">
        <rect width="480" height="300" fill="#ece7df"/>
        <rect x="0" y="255" width="480" height="45" fill="#d8d0c4"/>
        <rect x="20" y="22" width="440" height="58" fill="url(#slats)"/>
        <text x="440" y="62" text-anchor="end" font-family="Manrope, system-ui, sans-serif" font-weight="600" font-size="26" fill="#fff" style="filter:drop-shadow(0 0 6px #fff8)">Track&amp;Field</text>
        <rect x="20" y="80" width="440" height="176" fill="#b9b2a8"/>
        <rect x="34" y="88" width="170" height="160" fill="url(#interior)"/>
        <rect x="214" y="88" width="62" height="160" fill="#f7efe4"/>
        <rect x="286" y="88" width="160" height="160" fill="url(#interior)"/>
        <use href="#mq" x="48" y="118" width="34" height="112"/><use href="#top" x="48" y="118" width="34" height="112" color="#1f1f1f"/>
        <rect x="92" y="206" width="34" height="34" fill="#c9a27a"/><rect x="96" y="194" width="26" height="13" rx="6" fill="#26324a"/>
        <use href="#mq" x="138" y="118" width="34" height="112"/><use href="#top" x="138" y="118" width="34" height="112" color="#d9682b"/>
        <use href="#mq" x="300" y="118" width="34" height="112"/><use href="#bottom" x="300" y="118" width="34" height="112" color="#26324a"/>
        <use href="#mq" x="352" y="118" width="34" height="112"/><use href="#top" x="352" y="118" width="34" height="112" color="#e1a51e"/>
        <rect x="398" y="200" width="34" height="40" fill="#c9a27a"/><rect x="404" y="176" width="22" height="26" rx="3" fill="#1f1f1f"/>
        <rect x="34" y="88" width="170" height="160" fill="url(#glass)"/><rect x="286" y="88" width="160" height="160" fill="url(#glass)"/>
      </svg>
      <figcaption><b>1 · Abertura (0,8 s)</b>A fachada aparece, o letreiro acende e a câmera aproxima do vidro. A lista de links já fica clicável desde o primeiro instante.</figcaption>
    </figure>

    <figure>
      <svg viewBox="0 0 480 300" role="img" aria-label="Parada em um manequim">
        <rect width="480" height="300" fill="url(#interior)"/>
        <ellipse cx="285" cy="40" rx="120" ry="260" fill="url(#spot)"/>
        <rect x="360" y="150" width="90" height="100" fill="#c9a27a"/><rect x="372" y="122" width="66" height="30" rx="14" fill="#26324a"/>
        <use href="#mq" x="235" y="40" width="100" height="232"/><use href="#top" x="235" y="40" width="100" height="232" color="#1f1f1f"/>
        <rect width="480" height="300" fill="url(#glass)"/>
        <text x="28" y="58" font-family="Manrope, system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="2" fill="#7a7168">03 / 08 · VENDAS</text>
        <text x="28" y="86" font-family="Manrope, system-ui, sans-serif" font-size="24" font-weight="800" fill="#2a2622">Sistema de Vendas</text>
        <text x="28" y="106" font-family="Manrope, system-ui, sans-serif" font-size="11" fill="#7a7168">Casaco PowerCool · abre em nova aba</text>
        <rect x="28" y="120" width="86" height="28" rx="14" fill="#2a2622"/><text x="71" y="138" text-anchor="middle" font-family="Manrope, system-ui, sans-serif" font-size="11" font-weight="600" fill="#fff">Abrir ↗</text>
        <circle cx="22" cy="200" r="13" fill="#fff" opacity=".85"/><text x="22" y="205" text-anchor="middle" font-size="13" fill="#2a2622">‹</text>
        <circle cx="458" cy="200" r="13" fill="#fff" opacity=".85"/><text x="458" y="205" text-anchor="middle" font-size="13" fill="#2a2622">›</text>
        <rect x="0" y="264" width="480" height="36" fill="#fff" opacity=".9"/>
        <g font-family="Manrope, system-ui, sans-serif" font-size="8.5" fill="#7a7168" text-anchor="middle">
          <text x="34" y="286">Estoque</text><text x="92" y="286">Ponto</text>
          <text x="150" y="286" fill="#2a2622" font-weight="800">Vendas</text><text x="210" y="286">Metas</text>
          <text x="268" y="286">Treinos</text><text x="328" y="286">Avisos</text><text x="388" y="286">Agenda</text><text x="446" y="286">Suporte</text>
        </g>
        <rect x="132" y="292" width="36" height="2" fill="#d9682b"/>
      </svg>
      <figcaption><b>2 · Parada (desktop)</b>A câmera para em frente a um manequim ou cubo. O nome do link aparece como letreiro de vitrine. Mover o mouse dá um leve efeito 3D de profundidade. O clique no produto ou em "Abrir" leva ao site.</figcaption>
    </figure>

    <figure>
      <div class="mobile-wrap">
      <svg viewBox="0 0 180 340" role="img" aria-label="Versão celular">
        <rect x="0" y="0" width="180" height="340" rx="22" fill="#1b1b1b"/>
        <rect x="7" y="7" width="166" height="326" rx="17" fill="url(#interior)"/>
        <ellipse cx="90" cy="60" rx="70" ry="220" fill="url(#spot)"/>
        <use href="#mq" x="42" y="70" width="96" height="220"/><use href="#bottom" x="42" y="70" width="96" height="220" color="#26324a"/>
        <text x="18" y="38" font-family="Manrope, system-ui, sans-serif" font-size="7" font-weight="600" letter-spacing="1.5" fill="#7a7168">04 / 08 · METAS</text>
        <text x="18" y="56" font-family="Manrope, system-ui, sans-serif" font-size="15" font-weight="800" fill="#2a2622">Painel de Metas</text>
        <rect x="18" y="290" width="144" height="26" rx="13" fill="#2a2622"/><text x="90" y="307" text-anchor="middle" font-family="Manrope, system-ui, sans-serif" font-size="9" font-weight="600" fill="#fff">Abrir ↗</text>
        <g fill="#7a7168"><circle cx="62" cy="326" r="1.6"/><circle cx="70" cy="326" r="1.6"/><circle cx="78" cy="326" r="1.6"/><circle cx="86" cy="326" r="2.4" fill="#d9682b"/><circle cx="94" cy="326" r="1.6"/><circle cx="102" cy="326" r="1.6"/><circle cx="110" cy="326" r="1.6"/><circle cx="118" cy="326" r="1.6"/></g>
      </svg>
      </div>
      <figcaption><b>3 · Celular</b>O enquadramento é vertical e centrado no manequim. Deslizar para os lados passa para o próximo item.</figcaption>
    </figure>

    <figure class="wide">
      <svg viewBox="0 0 960 230" role="img" aria-label="Vista de cima do percurso da câmera">
        <rect width="960" height="230" fill="#f4efe8"/>
        <rect x="40" y="20" width="880" height="110" fill="#fbf6ee" stroke="#c9bfb2"/>
        <line x1="40" y1="130" x2="920" y2="130" stroke="#7fb3c9" stroke-width="4"/>
        <text x="925" y="134" font-family="Manrope, system-ui, sans-serif" font-size="11" fill="#7a7168">vidro</text>
        <g font-family="Manrope, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#2a2622">
          <g transform="translate(95,80)"><circle r="16" fill="#8f8f8f"/><text y="4" fill="#fff" font-weight="800">M</text><text y="-26">Casaco PowerCool</text></g>
          <g transform="translate(200,80)"><rect x="-16" y="-16" width="32" height="32" fill="#c9a27a"/><text y="4" fill="#fff" font-weight="800">C</text><text y="-26">Mala Duffel</text></g>
          <g transform="translate(305,80)"><circle r="16" fill="#8f8f8f"/><text y="4" fill="#fff" font-weight="800">M</text><text y="-26">Camiseta ThermoDry</text></g>
          <g transform="translate(410,80)"><circle r="16" fill="#8f8f8f"/><text y="4" fill="#fff" font-weight="800">M</text><text y="-26">Shorts Laser</text></g>
          <g transform="translate(515,80)"><circle r="16" fill="#8f8f8f"/><text y="4" fill="#fff" font-weight="800">M</text><text y="-26">Jaqueta Winter</text></g>
          <g transform="translate(620,80)"><rect x="-16" y="-16" width="32" height="32" fill="#c9a27a"/><text y="4" fill="#fff" font-weight="800">C</text><text y="-26">Mala Trip</text></g>
          <g transform="translate(725,80)"><circle r="16" fill="#8f8f8f"/><text y="4" fill="#fff" font-weight="800">M</text><text y="-26">Camiseta Sports</text></g>
          <g transform="translate(830,80)"><rect x="-16" y="-16" width="32" height="32" fill="#c9a27a"/><text y="4" fill="#fff" font-weight="800">C</text><text y="-26">Acessórios</text></g>
        </g>
        <path d="M95 175 H830" stroke="#d9682b" stroke-width="2.5" stroke-dasharray="7 6" fill="none"/>
        <g fill="#d9682b"><circle cx="95" cy="175" r="6"/><circle cx="200" cy="175" r="6"/><circle cx="305" cy="175" r="6"/><circle cx="410" cy="175" r="6"/><circle cx="515" cy="175" r="6"/><circle cx="620" cy="175" r="6"/><circle cx="725" cy="175" r="6"/><circle cx="830" cy="175" r="6"/></g>
        <g font-family="Manrope, system-ui, sans-serif" font-size="10" fill="#7a7168" text-anchor="middle">
          <text x="95" y="198">1</text><text x="200" y="198">2</text><text x="305" y="198">3</text><text x="410" y="198">4</text><text x="515" y="198">5</text><text x="620" y="198">6</text><text x="725" y="198">7</text><text x="830" y="198">8</text>
        </g>
        <text x="40" y="220" font-family="Manrope, system-ui, sans-serif" font-size="11" fill="#7a7168">Percurso da câmera pelo lado de fora da vitrine: cada ponto é uma parada (um link). Cada trecho entre paradas é um vídeo curto pré-renderizado no Blender.</text>
      </svg>
      <figcaption><b>4 · Vista de cima</b>São oito paradas: cinco manequins (M) e três cubos (C) com os produtos de referência. A ordem e a combinação de produto com link são definidas na planilha.</figcaption>
    </figure>
  </div>
  <p class="note">Cores e materiais tirados das fotos das lojas: ripado de madeira, molduras cinza-quente, interior branco com luz quente, cubos de madeira clara e manequins cinza ou pretos foscos.</p>
</main>
</body>
</html>
