<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hub Track&amp;Field</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ripado: #8b5e3c;
      --ripado-claro: #a0714a;
      --ripado-escuro: #4f321e;
      --moldura: #b3aca2;
      --moldura-escura: #958e84;
      --parede: #ece9e4;
      --noturno: #1f2740;
      --noturno-suave: #4e5569;
      --fonte: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
      --saida: cubic-bezier(.23, 1, .32, 1);
      /* Enquadramento dos renders 4:3: produto a 65% da largura. */
      --foco-y: 45%;
      --foco: 65% var(--foco-y);
      /* Proporção máxima da vitrine no computador (largura / altura). */
      --proporcao: 1.8;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--moldura);
      color: var(--noturno);
      font-family: var(--fonte);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      overscroll-behavior: none;
    }
    button { font: inherit; color: inherit; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    .loja {
      height: 100vh;
      height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      grid-template-columns: minmax(0, 1fr);
    }

    /* Fachada: ripado de madeira com o letreiro iluminado */
    .fachada {
      position: relative;
      height: clamp(68px, 14vh, 128px);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 clamp(20px, 4.5vw, 64px);
      background:
        linear-gradient(180deg, rgb(255 236 210 / .14), rgb(0 0 0 / .22)),
        repeating-linear-gradient(90deg,
          var(--ripado-claro) 0 2px, var(--ripado) 2px 8px,
          #6f4a2e 8px 10px, var(--ripado-escuro) 10px 12px);
      box-shadow: inset 0 -14px 22px -14px rgb(0 0 0 / .55);
    }
    .letreiro {
      margin: 0;
      font-weight: 500;
      font-size: clamp(30px, 5.4vh + 1vw, 66px);
      letter-spacing: -.015em;
      line-height: 1;
      color: #cfb9a2;
      text-shadow: 0 2px 0 rgb(40 24 12 / .35);
      transition: color .5s ease, text-shadow .9s ease;
      user-select: none;
    }
    .acesa .letreiro {
      color: #fff;
      text-shadow:
        0 2px 0 rgb(40 24 12 / .25),
        0 0 2px #fff,
        0 0 14px rgb(255 250 240 / .7),
        0 0 36px rgb(255 232 196 / .45);
    }

    /* Moldura cinza: a vitrine fica centralizada e no máximo 1,8x mais larga que alta,
       para os renders 4:3 não perderem a cabeça dos manequins em telas largas. */
    .moldura {
      position: relative;
      min-height: 0;
      display: flex;
      justify-content: center;
      overflow: hidden;
      padding: 10px clamp(8px, 2.2vw, 30px) 0;
      background: linear-gradient(180deg, var(--moldura-escura), var(--moldura) 30px);
    }

    .vitrine {
      position: relative;
      z-index: 1;
      height: 100%;
      width: auto;
      min-width: 0;
      max-width: 100%;
      aspect-ratio: var(--proporcao);
      overflow: hidden;
      background: var(--parede);
      touch-action: pan-y;
      user-select: none;
      -webkit-user-select: none;
      box-shadow: inset 0 0 0 1px rgb(0 0 0 / .06);
    }

    /* Telas mais largas que a vitrine: as laterais continuam a cena com o próprio render,
       espelhado e desfocado (como a profundidade de campo de uma lente), e as bordas da
       vitrine se dissolvem nele. A faixa tem três cópias lado a lado (espelho, render,
       espelho), na mesma escala e altura da vitrine, então a emenda é contínua e o rodapé
       da parede fica na mesma linha. A classe .larga é posta pelo script. */
    .ambiente {
      display: none;
      position: absolute;
      inset: 10px 0 0;  /* mesma faixa vertical da vitrine (padding de .moldura) */
      overflow: hidden;
      pointer-events: none;
    }
    .larga .ambiente { display: block; }
    .faixa {
      position: absolute;
      left: 50%;
      /* O render 4:3 ocupa a largura da vitrine (proporção x altura), então tem
         proporção x 3/4 da altura dela, deslocado como no object-position (--foco-y).
         Assim sobra imagem de verdade acima e abaixo para o desfoque não clarear as bordas. */
      top: calc((1 - var(--proporcao) * .75) * var(--foco-y));
      height: calc(var(--proporcao) * 75%);
      display: flex;
      transform: translateX(-50%);
      filter: blur(16px) saturate(.92);
      opacity: 0;
      transition: opacity .9s ease;
      will-change: opacity;
    }
    .faixa.visivel { opacity: 1; }
    .faixa.topo { z-index: 1; }
    .faixa img {
      flex: none;
      height: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
    }
    .faixa img:not(:nth-child(2)) { transform: scaleX(-1); }
    /* Vinheta nas pontas e a loja "apagada" até a primeira imagem chegar. */
    .ambiente::before, .ambiente::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
    }
    .ambiente::before {
      background: linear-gradient(90deg, rgb(52 44 36 / .3), rgb(52 44 36 / 0) 22%,
                                         rgb(52 44 36 / 0) 78%, rgb(52 44 36 / .3));
    }
    .ambiente::after {
      background: rgb(28 22 17 / .62);
      transition: opacity .8s ease .25s;
    }
    .acesa .ambiente::after { opacity: 0; }
    .larga .vitrine { background: transparent; box-shadow: none; }
    .larga .quadro, .larga .travelling {
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent);
      mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent);
    }

    .quadro, .travelling {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: var(--foco);
      -webkit-user-drag: none;
    }
    .quadro { transition: opacity .45s ease; }
    .quadro.saindo { opacity: 0; }
    .quadro.fundo { z-index: 0; }
    .quadro.frente { z-index: 1; }
    .travelling {
      z-index: 2;
      opacity: 0;
      pointer-events: none;
    }
    .travelling.visivel { opacity: 1; }

    /* Área clicável sobre o produto. */
    .alvo-produto {
      position: absolute;
      z-index: 3;
      left: 52%;
      width: 26%;
      top: 8%;
      bottom: 8%;
      border-radius: 40px;
      -webkit-tap-highlight-color: transparent;
    }
    .alvo-produto:focus-visible { outline: 2px solid var(--noturno); outline-offset: -6px; }

    /* Adesivo jateado no vidro com o nome do link: o fundo fosco mantém o texto legível
       mesmo com um manequim vizinho atrás dele. */
    .adesivo {
      position: absolute;
      z-index: 4;
      left: 4.5%;
      top: 50%;
      width: 42%;
      transform: translateY(-50%);
      pointer-events: none;
    }
    .placa {
      width: fit-content;
      max-width: 100%;
      padding: clamp(20px, 2.1vw, 30px) clamp(22px, 2.4vw, 34px);
      border-radius: 22px;
      background: rgb(250 248 244 / .56);
      -webkit-backdrop-filter: blur(18px) saturate(1.2);
      backdrop-filter: blur(18px) saturate(1.2);
      box-shadow: inset 0 0 0 1px rgb(255 255 255 / .6), 0 20px 44px -28px rgb(31 39 64 / .45);
    }
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .placa { background: rgb(250 248 244 / .9); }
    }
    .adesivo .placa, .adesivo .texto > * {
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .2s ease, transform .2s ease;
    }
    .adesivo.visivel .placa, .adesivo.visivel .texto > * {
      opacity: 1;
      transform: none;
      transition: opacity .45s var(--saida), transform .45s var(--saida);
    }
    .adesivo.visivel .texto > :nth-child(2) { transition-delay: 40ms; }
    .adesivo.visivel .texto > :nth-child(3) { transition-delay: 80ms; }
    .adesivo .abrir {
      opacity: 0;
      transition: opacity .2s ease, background-color .2s ease, transform .15s ease;
    }
    .adesivo.visivel .abrir {
      opacity: 1;
      pointer-events: auto;
      transition: opacity .45s var(--saida) 120ms, background-color .2s ease, transform .15s ease;
    }
    .categoria {
      margin: 0 0 10px;
      font-size: 15px;
      font-weight: 500;
      color: var(--noturno-suave);
    }
    .nome {
      margin: 0;
      font-size: clamp(32px, 3.6vw, 60px);
      font-weight: 500;
      line-height: 1.02;
      letter-spacing: -.025em;
      text-wrap: balance;
    }
    .descricao {
      margin: 14px 0 26px;
      max-width: 30ch;
      font-size: 17px;
      font-weight: 300;
      line-height: 1.45;
      color: var(--noturno-suave);
    }
    .abrir {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 48px;
      padding: 0 24px;
      border-radius: 999px;
      background: var(--noturno);
      color: #fff;
      font-size: 16px;
      font-weight: 500;
      text-decoration: none;
      transition: background-color .2s ease, transform .15s ease;
    }
    .abrir svg { width: 14px; height: 14px; transition: transform .2s ease; }
    .abrir:active { transform: scale(.97); }
    .abrir:focus-visible { outline: 2px solid var(--noturno); outline-offset: 3px; }
    @media (hover: hover) {
      .abrir:hover { background: #2d3758; }
      .abrir:hover svg { transform: translate(2px, -2px); }
    }

    .apagado {
      position: absolute;
      inset: 0;
      z-index: 5;
      background: rgb(28 22 17 / .62);
      pointer-events: none;
      transition: opacity .8s ease .25s;
    }
    .acesa .apagado { opacity: 0; }

    .seta {
      position: absolute;
      top: 50%;
      z-index: 6;
      width: 52px;
      height: 52px;
      margin-top: -26px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: rgb(255 255 255 / .62);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      box-shadow: 0 1px 0 rgb(255 255 255 / .8) inset, 0 6px 18px -8px rgb(0 0 0 / .35);
      cursor: pointer;
      transition: background-color .2s ease, opacity .2s ease, transform .15s ease;
    }
    .seta svg { width: 18px; height: 18px; }
    .seta:active { transform: scale(.94); }
    .seta:focus-visible { outline: 2px solid var(--noturno); outline-offset: 2px; }
    .seta[disabled] { opacity: 0; pointer-events: none; }
    .seta.anterior { left: 18px; }
    .seta.proxima { right: 18px; }
    @media (hover: hover) { .seta:hover { background: rgb(255 255 255 / .9); } }

    .aviso {
      position: absolute;
      inset: 0;
      z-index: 6;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      font-size: 18px;
      color: var(--noturno-suave);
      background: var(--parede);
    }
    .aviso strong { display: block; color: var(--noturno); font-weight: 500; font-size: 22px; margin-bottom: 6px; }

    /* Soleira: índice de todos os links */
    .soleira {
      display: flex;
      align-items: center;
      gap: 24px;
      min-height: 64px;
      padding: 8px clamp(16px, 2.2vw, 30px) calc(8px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, #a59e94, var(--moldura) 8px);
    }
    .soleira-titulo {
      flex: none;
      margin: 0;
      font-size: 14px;
      font-weight: 500;
      color: #4a4741;
    }
    .indice {
      display: flex;
      gap: 4px;
      margin: 0;
      padding: 0;
      list-style: none;
      overflow-x: auto;
      scrollbar-width: none;
      flex: 1;
      min-width: 0;
    }
    .indice::-webkit-scrollbar { display: none; }
    .indice button {
      position: relative;
      min-height: 44px;
      padding: 0 14px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #46433d;
      font-size: 15px;
      white-space: nowrap;
      cursor: pointer;
      transition: color .2s ease, background-color .2s ease;
    }
    .indice button::after {
      content: "";
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 6px;
      height: 2px;
      border-radius: 2px;
      background: var(--noturno);
      transform: scaleX(0);
      transition: transform .35s var(--saida);
    }
    .indice button[aria-current="true"] { color: var(--noturno); font-weight: 500; }
    .indice button[aria-current="true"]::after { transform: scaleX(1); }
    .indice button:focus-visible { outline: 2px solid var(--noturno); outline-offset: -2px; }
    @media (hover: hover) { .indice button:hover { background: rgb(255 255 255 / .25); } }
    .contador {
      flex: none;
      margin: 0;
      font-size: 14px;
      color: #4a4741;
      font-variant-numeric: tabular-nums;
    }


    /* Lupa: consulta de produtos (EAN, código TF ou nome) */
    .lupa {
      position: absolute;
      left: clamp(14px, 3vw, 40px);
      top: 50%;
      width: 48px;
      height: 48px;
      margin-top: -24px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: #fff;
      background: rgb(255 255 255 / .14);
      box-shadow: inset 0 0 0 1px rgb(255 255 255 / .38), 0 6px 16px -8px rgb(0 0 0 / .5);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      cursor: pointer;
      transition: background-color .2s ease, transform .15s ease;
    }
    .lupa svg { width: 22px; height: 22px; }
    .lupa:active { transform: scale(.94); }
    .lupa:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    @media (hover: hover) { .lupa:hover { background: rgb(255 255 255 / .26); } }

    .consulta {
      width: min(560px, calc(100vw - 24px));
      max-height: min(86dvh, 820px);
      padding: 0;
      border: 0;
      border-radius: 22px;
      background: #faf8f4;
      color: var(--noturno);
      font-family: var(--fonte);
      box-shadow: 0 30px 80px -30px rgb(20 16 12 / .6);
      overflow: hidden;
    }
    .consulta[open] { display: flex; animation: consulta-entra .22s var(--saida); }
    .consulta::backdrop { background: rgb(28 22 17 / .45); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
    @keyframes consulta-entra { from { opacity: 0; transform: translateY(10px) scale(.98); } }
    .consulta-caixa {
      display: flex;
      flex-direction: column;
      width: 100%;
      min-height: 0;
      padding: 22px 22px 0;
    }
    .consulta-topo { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .consulta-topo h2 { margin: 0; font-size: 22px; font-weight: 500; letter-spacing: -.01em; }
    .fechar {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--noturno-suave);
      cursor: pointer;
    }
    .fechar svg { width: 18px; height: 18px; }
    .fechar:focus-visible { outline: 2px solid var(--noturno); }
    @media (hover: hover) { .fechar:hover { background: rgb(31 39 64 / .07); } }
    .consulta-ajuda { margin: 4px 0 16px; font-size: 14px; color: var(--noturno-suave); }
    .consulta-form { display: flex; gap: 8px; }
    .consulta-form input {
      flex: 1;
      min-width: 0;
      min-height: 50px;
      padding: 0 16px;
      border: 1px solid #d8d2c8;
      border-radius: 14px;
      background: #fff;
      color: var(--noturno);
      font: 400 17px var(--fonte);
    }
    .consulta-form input:focus { outline: 2px solid var(--noturno); outline-offset: -1px; border-color: transparent; }
    .botao {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 50px;
      padding: 0 20px;
      border: 0;
      border-radius: 14px;
      font: 500 16px var(--fonte);
      cursor: pointer;
      transition: background-color .2s ease, transform .15s ease;
    }
    .botao:active { transform: scale(.97); }
    .botao:focus-visible { outline: 2px solid var(--noturno); outline-offset: 2px; }
    .botao svg { width: 20px; height: 20px; }
    .botao.primario { background: var(--noturno); color: #fff; }
    .botao.secundario { width: 100%; margin-top: 10px; background: rgb(31 39 64 / .07); color: var(--noturno); }
    @media (hover: hover) {
      .botao.primario:hover { background: #2d3758; }
      .botao.secundario:hover { background: rgb(31 39 64 / .12); }
    }
    .consulta-status { min-height: 20px; margin: 14px 0 6px; font-size: 14px; color: var(--noturno-suave); }
    .consulta-status.erro { color: #a3352b; }
    .resultados {
      flex: 1;
      min-height: 0;
      margin: 0 -22px;
      padding: 0 22px 22px;
      overflow-y: auto;
      list-style: none;
      overscroll-behavior: contain;
    }
    .produto-consulta {
      display: grid;
      grid-template-columns: 96px 1fr;
      gap: 16px;
      padding: 14px 0;
      border-top: 1px solid #e7e2da;
    }
    .produto-consulta:first-child { border-top: 0; }
    .produto-consulta img {
      width: 96px;
      aspect-ratio: 400 / 559;
      object-fit: cover;
      border-radius: 12px;
      background: #eceeed;
    }
    .produto-consulta h3 { margin: 0; font-size: 17px; font-weight: 500; line-height: 1.25; }
    .ficha { margin: 6px 0 0; font-size: 14px; line-height: 1.5; color: var(--noturno-suave); font-variant-numeric: tabular-nums; }
    .cor { display: inline-flex; align-items: center; gap: 6px; }
    .amostra-cor { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .18); }
    .precos { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-top: 10px; font-variant-numeric: tabular-nums; }
    .preco { font-size: 20px; font-weight: 600; }
    .preco-cheio { font-size: 15px; color: var(--noturno-suave); }
    .preco-cheio s { text-decoration-thickness: 1px; }
    .selo {
      padding: 2px 8px;
      border-radius: 999px;
      background: #e9f3ec;
      color: #1f6b3a;
      font-size: 13px;
      font-weight: 600;
    }
    .selo.esgotado { background: #f4e9e7; color: #8a3a30; }
    .ver-site { display: inline-block; margin-top: 8px; font-size: 14px; color: var(--noturno); }

    @media (max-width: 720px) {
      .consulta {
        width: 100vw;
        max-width: 100vw;
        max-height: 92dvh;
        margin: auto 0 0;
        border-radius: 22px 22px 0 0;
      }
      .consulta[open] { animation-name: consulta-sobe; }
      .consulta-caixa { padding: 18px 16px 0; }
      .resultados { margin: 0 -16px; padding: 0 16px calc(16px + env(safe-area-inset-bottom)); }
      .consulta-form .botao.primario { padding: 0 16px; }
    }
    @keyframes consulta-sobe { from { transform: translateY(40px); opacity: .6; } }

    /* Celular: a vitrine ocupa a largura; o render é recortado em volta do produto. */
    @media (max-width: 720px) {
      .fachada { justify-content: center; }
      .seta, .soleira-titulo, .contador { display: none; }
      .soleira { padding-inline: 8px; }
      .vitrine { width: 100%; aspect-ratio: auto; }
      .adesivo {
        inset: 3% 5% 4% 5%;
        width: auto;
        transform: none;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }
      /* No celular a placa fosca envolve só o texto; o botão fica embaixo, sozinho. */
      .placa { display: contents; }
      .texto {
        max-width: 100%;
        padding: 11px 16px 13px;
        border-radius: 16px;
        background: rgb(250 248 244 / .56);
        -webkit-backdrop-filter: blur(16px) saturate(1.2);
        backdrop-filter: blur(16px) saturate(1.2);
        box-shadow: inset 0 0 0 1px rgb(255 255 255 / .6), 0 16px 36px -26px rgb(31 39 64 / .45);
      }
      .adesivo .texto {
        opacity: 0;
        transform: translateY(8px);
        transition: opacity .2s ease, transform .2s ease;
      }
      .adesivo.visivel .texto {
        opacity: 1;
        transform: none;
        transition: opacity .45s var(--saida), transform .45s var(--saida);
      }
      .nome { font-size: clamp(28px, 8.4vw, 38px); }
      .categoria { margin-bottom: 4px; font-size: 14px; }
      .descricao { margin: 5px 0 0; font-size: 15px; }
      .abrir { margin-top: auto; align-self: stretch; justify-content: center; min-height: 52px; }
      .alvo-produto { left: 20%; width: 60%; top: 22%; bottom: 16%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .letreiro, .apagado, .quadro, .faixa, .ambiente::after, .placa, .texto, .texto > *, .abrir,
      .indice button::after, .lupa, .botao { transition: none !important; }
      .consulta[open] { animation: none; }
    }
  </style>
</head>
<body>

  <script>
  (function () {
    'use strict';

    // Imagens e vídeos da vitrine 3D, servidos pela CDN do jsDelivr a partir de um commit
    // fixo do repositório (não muda, então o cache nunca fica velho). Ao trocar as mídias,
    // faça o commit delas e ponha aqui o hash desse commit.
    var MIDIA = 'https://cdn.jsdelivr.net/gh/lucasfranco-dev/hub-trackfield@469e9068f3cf08c9af9373dc74c42de73d8a6b73/midia/';

    // Paradas da vitrine 3D, na ordem em que a câmera passa (3d/vitrine.py).
    var VITRINE = ['Casaco PowerCool', 'Mala Duffel Matelassê', 'Camiseta ThermoDry', 'Shorts Laser',
                   'Jaqueta Winter', 'Mala Trip', 'Camiseta Sports', 'Garrafa Urban 950 ml'];

    // Usado só na pré-visualização local, fora do Apps Script.
    var AMOSTRA = [
      { nome: 'Sistema de vendas', categoria: 'Vendas', descricao: 'Pedidos, trocas e vendas do dia.', url: 'https://example.com/vendas', produto: 'Casaco PowerCool' },
      { nome: 'Consulta de estoque', categoria: 'Estoque', descricao: 'Disponibilidade nesta loja e nas outras.', url: 'https://example.com/estoque', produto: 'Mala Duffel Matelassê' },
      { nome: 'Escala e ponto', categoria: 'Equipe', descricao: 'Horários da semana e registro de ponto.', url: 'https://example.com/ponto', produto: 'Camiseta ThermoDry' },
      { nome: 'Metas da loja', categoria: 'Resultados', descricao: 'Acompanhe as metas do dia e do mês.', url: 'https://example.com/metas', produto: 'Shorts Laser' },
      { nome: 'Treinamentos', categoria: 'Aprendizado', descricao: 'Cursos sobre produtos e atendimento.', url: 'https://example.com/treinamentos', produto: 'Jaqueta Winter' },
      { nome: 'Comunicados', categoria: 'Comunicação', descricao: 'Avisos da gestão e campanhas em vigor.', url: 'https://example.com/comunicados', produto: 'Mala Trip' },
      { nome: 'Catálogo online', categoria: 'Produto', descricao: 'Toda a coleção no site oficial.', url: 'https://www.tf.com.br', produto: 'Camiseta Sports' },
      { nome: 'Suporte', categoria: 'Ajuda', descricao: 'Abra um chamado para TI ou manutenção.', url: 'https://example.com/suporte', produto: 'Garrafa Urban 950 ml' }
    ];

    var $ = function (id) { return document.getElementById(id); };
    var loja = $('loja'), vitrine = $('vitrine'), adesivo = $('adesivo'), alvo = $('alvoProduto');
    var indice = $('indice'), contador = $('contador'), anuncio = $('anuncio');
    var btnAnterior = $('anterior'), btnProxima = $('proxima');
    var quadros = [$('quadroA'), $('quadroB')];
    var frente = 0;  // índice em `quadros` da imagem visível
    var moldura = $('moldura');
    var faixas = moldura.querySelectorAll('.faixa');
    var faixaFrente = 0;  // índice em `faixas` da camada visível das laterais

    var reduzido = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var dados = lerDados();
    var links = Array.isArray(dados) ? dados : (dados.links || []);
    var paradas = links.map(paradaDoLink);
    var atual = 0;
    var ocupado = false;
    var pedido = null;
    var videos = {};

    function lerDados() {
      try { return JSON.parse($('dados').textContent); } catch (e) { return AMOSTRA; }
    }

    function normalizar(t) {
      return String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
    }

    // Parada da vitrine de cada link: pelo nome do produto na planilha, ou pela ordem.
    function paradaDoLink(link, i) {
      var alvoNome = normalizar(link.produto);
      for (var k = 0; k < VITRINE.length; k++) if (normalizar(VITRINE[k]) === alvoNome) return k;
      return i % VITRINE.length;
    }

    function urlSegura(url) { return /^https?:\/\//i.test(String(url || '')) ? url : null; }
    function srcQuadro(p) { return MIDIA + 'paradas/parada-' + p + '.webp'; }
    // MP4 (H.264) onde o navegador toca; senão WebM (VP9).
    var EXTENSAO_VIDEO = document.createElement('video').canPlayType('video/mp4; codecs="avc1.64001F"') ? '.mp4' : '.webm';
    function srcVideo(de, para) {
      return para === de + 1 ? MIDIA + 'transicoes/transicao-' + de + '-ida' + EXTENSAO_VIDEO
           : para === de - 1 ? MIDIA + 'transicoes/transicao-' + para + '-volta' + EXTENSAO_VIDEO : null;
    }

    function el(tag, classe, texto) {
      var n = document.createElement(tag);
      if (classe) n.className = classe;
      if (texto) n.textContent = texto;
      return n;
    }

    var ICONE_ABRIR = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 11L11 5M6 5h5v5"/></svg>';

    // ------------------------------------------------------------ montagem

    function montar() {
      if (dados && dados.erro) return mostrarAviso('Não foi possível ler a planilha', dados.erro);
      if (!links.length) return mostrarAviso('Nenhum link ativo', 'Marque a coluna Ativo na planilha para exibir os links aqui.');

      links.forEach(function (link, i) {
        var li = el('li');
        var b = el('button', null, link.nome);
        b.type = 'button';
        b.addEventListener('click', function () { irPara(i); });
        li.appendChild(b);
        indice.appendChild(li);
      });

      quadros[0].src = srcQuadro(paradas[0]);
      quadros[0].setAttribute('fetchpriority', 'high');
      trocarAmbiente(srcQuadro(paradas[0]));
      medirLaterais();
      if (window.ResizeObserver) new ResizeObserver(medirLaterais).observe(moldura);
      else window.addEventListener('resize', medirLaterais);
      preencherAdesivo(0);
      marcar(0, true);
      adesivo.classList.add('visivel');
      prepararVizinhos();
      ligarEventos();
      acenderQuandoPronto(quadros[0]);
    }

    function mostrarAviso(titulo, texto) {
      var aviso = el('div', 'aviso');
      var caixa = el('div');
      caixa.appendChild(el('strong', null, titulo));
      caixa.appendChild(document.createTextNode(texto));
      aviso.appendChild(caixa);
      vitrine.appendChild(aviso);
      btnAnterior.disabled = btnProxima.disabled = true;
      acender();
    }

    function preencherAdesivo(i) {
      var link = links[i];
      var url = urlSegura(link.url);
      adesivo.textContent = '';
      adesivo.setAttribute('aria-label', (i + 1) + ' de ' + links.length);
      var placa = el('div', 'placa');
      var texto = el('div', 'texto');
      if (link.categoria) texto.appendChild(el('p', 'categoria', link.categoria));
      texto.appendChild(el('h2', 'nome', link.nome));
      if (link.descricao) texto.appendChild(el('p', 'descricao', link.descricao));
      placa.appendChild(texto);
      adesivo.appendChild(placa);
      if (url) {
        var abrir = el('a', 'abrir');
        abrir.href = url;
        abrir.target = '_blank';
        abrir.rel = 'noopener noreferrer';
        abrir.textContent = 'Abrir';
        abrir.insertAdjacentHTML('beforeend', ICONE_ABRIR);
        abrir.setAttribute('aria-label', 'Abrir ' + link.nome + ' em nova aba');
        placa.appendChild(abrir);
        alvo.href = url;
      } else {
        alvo.removeAttribute('href');
      }
    }

    function marcar(i, inicial) {
      Array.prototype.forEach.call(indice.querySelectorAll('button'), function (b, k) {
        b.setAttribute('aria-current', k === i ? 'true' : 'false');
      });
      btnAnterior.disabled = i === 0;
      btnProxima.disabled = i === links.length - 1;
      contador.textContent = (i + 1) + ' de ' + links.length;
      var b = indice.querySelectorAll('button')[i];
      if (b) indice.scrollTo({ left: b.offsetLeft - (indice.clientWidth - b.offsetWidth) / 2, behavior: inicial ? 'auto' : 'smooth' });
      if (!inicial) anuncio.textContent = links[i].nome + ', ' + (i + 1) + ' de ' + links.length;
    }

    // ------------------------------------------------------------ mídia

    // Pré-carrega as imagens dos vizinhos e os vídeos das transições possíveis a partir daqui.
    function prepararVizinhos() {
      [atual - 1, atual + 1].forEach(function (i) {
        if (i < 0 || i >= links.length) return;
        new Image().src = srcQuadro(paradas[i]);
        if (!reduzido) obterVideo(srcVideo(paradas[atual], paradas[i]));
      });
      // Depois do primeiro instante, carrega o resto das imagens sem pressa.
      setTimeout(function () { paradas.forEach(function (p) { new Image().src = srcQuadro(p); }); }, 2500);
    }

    function obterVideo(src) {
      if (!src) return null;
      if (videos[src]) return videos[src];
      var v = document.createElement('video');
      v.className = 'travelling';
      v.muted = true;
      v.defaultMuted = true;
      v.playsInline = true;
      v.setAttribute('playsinline', '');
      v.setAttribute('aria-hidden', 'true');
      v.preload = 'auto';
      v.src = src;
      vitrine.insertBefore(v, alvo);
      videos[src] = v;
      return v;
    }

    function carregarImagem(img, src) {
      return new Promise(function (ok) {
        if (img.getAttribute('src') === src && img.complete && img.naturalWidth) return ok();
        img.onload = img.onerror = function () { ok(); };
        img.src = src;
        if (img.decode) img.decode().then(ok, ok);
      });
    }

    function videoPronto(v, ms) {
      return new Promise(function (ok) {
        if (v.readyState >= 3) return ok(true);
        var feito = false;
        var fim = function (r) { if (!feito) { feito = true; ok(r); } };
        v.addEventListener('canplaythrough', function () { fim(true); }, { once: true });
        setTimeout(function () { fim(v.readyState >= 3); }, ms);
      });
    }

    // Troca a imagem visível por outra, com fade (ou na hora, com `instantaneo`).
    function trocarQuadro(src, instantaneo) {
      var atras = quadros[1 - frente];
      return carregarImagem(atras, src).then(function () {
        if (instantaneo) atras.style.transition = 'none';
        atras.classList.remove('fundo', 'saindo');
        atras.classList.add('frente');
        void atras.offsetWidth;  // aplica a troca antes de devolver a transição
        var antes = quadros[frente];
        antes.classList.remove('frente');
        antes.classList.add('fundo');
        frente = 1 - frente;
        return new Promise(function (ok) {
          setTimeout(function () {
            antes.classList.add('saindo');
            atras.style.transition = '';
            ok();
          }, instantaneo ? 0 : 460);
        });
      });
    }

    // Laterais (telas mais largas que a vitrine): troca a cena espelhada e desfocada
    // com fade, a nova camada por cima da antiga, para não aparecer o fundo no meio.
    function trocarAmbiente(src) {
      var nova = faixas[1 - faixaFrente], antiga = faixas[faixaFrente];
      faixaFrente = 1 - faixaFrente;
      var imgs = nova.querySelectorAll('img');
      return Promise.all(Array.prototype.map.call(imgs, function (img) {
        return carregarImagem(img, src);
      })).then(function () {
        if (nova !== faixas[faixaFrente]) return;  // já houve outra troca depois desta
        antiga.classList.remove('topo');
        nova.classList.add('topo', 'visivel');
        setTimeout(function () {
          if (antiga !== faixas[faixaFrente]) antiga.classList.remove('visivel');
        }, 950);
      });
    }

    // Liga as laterais só quando sobra espaço ao lado da vitrine (além do padding).
    function medirLaterais() {
      var estilo = getComputedStyle(moldura);
      var livre = moldura.clientWidth - parseFloat(estilo.paddingLeft) - parseFloat(estilo.paddingRight);
      moldura.classList.toggle('larga', livre - vitrine.offsetWidth > 2);
    }

    // ------------------------------------------------------------ navegação

    function irPara(i) {
      i = Math.max(0, Math.min(links.length - 1, i));
      if (i === atual) return;
      if (ocupado) { pedido = i; return; }
      ocupado = true;
      var de = atual;
      atual = i;
      marcar(i);
      adesivo.classList.remove('visivel');

      var destino = srcQuadro(paradas[i]);
      trocarAmbiente(destino);
      var video = reduzido ? null : obterVideo(srcVideo(paradas[de], paradas[i]));
      var passo = video ? videoPronto(video, 450).then(function (pronto) {
        return pronto ? tocarTravelling(video, destino) : trocarQuadro(destino);
      }) : trocarQuadro(destino, reduzido);

      passo.then(function () {
        preencherAdesivo(i);
        requestAnimationFrame(function () { adesivo.classList.add('visivel'); });
        ocupado = false;
        prepararVizinhos();
        if (pedido !== null) { var p = pedido; pedido = null; irPara(p); }
      });
    }

    // O vídeo cobre a imagem atual, faz o travelling e, no fim, a imagem do destino
    // (já carregada por trás) fica no lugar dele.
    function tocarTravelling(video, destino) {
      return new Promise(function (ok) {
        var atras = quadros[1 - frente];
        var preparo = carregarImagem(atras, destino);
        video.currentTime = 0;
        video.classList.add('visivel');
        var terminou = function () {
          preparo.then(function () {
            trocarQuadro(destino, true).then(function () {
              video.classList.remove('visivel');
              ok();
            });
          });
        };
        video.addEventListener('ended', terminou, { once: true });
        var tocando = video.play();
        if (tocando && tocando.catch) tocando.catch(function () {
          video.removeEventListener('ended', terminou);
          video.classList.remove('visivel');
          trocarQuadro(destino).then(ok);
        });
      });
    }

    function abrirAtual() {
      var a = adesivo.querySelector('.abrir');
      if (a) a.click();
    }

    function ligarEventos() {
      btnAnterior.addEventListener('click', function () { irPara(atual - 1); });
      btnProxima.addEventListener('click', function () { irPara(atual + 1); });

      document.addEventListener('keydown', function (e) {
        if (e.altKey || e.ctrlKey || e.metaKey) return;
        // Com a consulta aberta, ou digitando em um campo, as teclas não mexem na vitrine.
        if (document.querySelector('dialog[open]') || e.target.closest('input, textarea')) return;
        if (e.key === 'ArrowRight') { irPara(atual + 1); e.preventDefault(); }
        else if (e.key === 'ArrowLeft') { irPara(atual - 1); e.preventDefault(); }
        else if (e.key === 'Home') { irPara(0); e.preventDefault(); }
        else if (e.key === 'End') { irPara(links.length - 1); e.preventDefault(); }
        else if (/^[1-9]$/.test(e.key)) irPara(Number(e.key) - 1);
        else if (e.key === 'Enter' && (e.target === document.body || e.target === vitrine)) abrirAtual();
      });

      // Roda do mouse ou trackpad: um passo por gesto.
      var acumulado = 0, travadoAte = 0;
      vitrine.addEventListener('wheel', function (e) {
        e.preventDefault();
        var agora = Date.now();
        if (agora < travadoAte) return;
        acumulado += Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
        if (Math.abs(acumulado) > 40) {
          irPara(atual + (acumulado > 0 ? 1 : -1));
          acumulado = 0;
          travadoAte = agora + 900;
        }
      }, { passive: false });

      // Deslizar o dedo (ou arrastar o mouse) para os lados troca de link.
      var inicioX = null, inicioY = 0, inicioT = 0, arrastou = false;
      vitrine.addEventListener('pointerdown', function (e) {
        if (e.button !== 0 || e.target.closest('.seta, .abrir')) return;
        inicioX = e.clientX; inicioY = e.clientY; inicioT = performance.now(); arrastou = false;
      });
      vitrine.addEventListener('pointermove', function (e) {
        if (inicioX !== null && Math.abs(e.clientX - inicioX) > 10) arrastou = true;
      });
      vitrine.addEventListener('pointerup', function (e) {
        if (inicioX === null) return;
        var dx = e.clientX - inicioX, dy = e.clientY - inicioY;
        var rapido = Math.abs(dx) / Math.max(1, performance.now() - inicioT) > 0.4;
        if (Math.abs(dx) > Math.abs(dy) && (Math.abs(dx) > vitrine.clientWidth * 0.15 || (rapido && Math.abs(dx) > 30))) {
          irPara(atual + (dx < 0 ? 1 : -1));
        }
        inicioX = null;
      });
      vitrine.addEventListener('pointercancel', function () { inicioX = null; });
      // Um arraste não pode virar clique no produto.
      alvo.addEventListener('click', function (e) { if (arrastou) { e.preventDefault(); arrastou = false; } });
    }

    function acender() { requestAnimationFrame(function () { loja.classList.add('acesa'); }); }

    // Acende a loja quando a primeira imagem chega (ou depois de 1,2 s, o que vier antes).
    function acenderQuandoPronto(img) {
      var feito = false;
      var vai = function () { if (!feito) { feito = true; acender(); } };
      if (img.complete && img.naturalWidth) return vai();
      img.addEventListener('load', vai, { once: true });
      img.addEventListener('error', vai, { once: true });
      setTimeout(vai, 1200);
    }

    montar();
  })();
  </script>
  <script>
  // Consulta de produtos (lupa). A busca roda no servidor (buscarProduto, em Code.gs), que
  // consulta o site tf.com.br; a página não pode chamar o site direto por causa do CORS.
  (function () {
    'use strict';

    // Leitor de código de barras para navegadores sem BarcodeDetector nativo (iPhone, Firefox).
    // Mesma biblioteca do sistema de contagem de estoque, baseada no ZXing.
    var LIB_LEITOR = 'https://cdn.jsdelivr.net/npm/barcode-detector@3.2.3/pure/+esm';
    var FORMATOS = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128'];
    var SITE = 'https://www.tf.com.br/';
    var IMAGENS = 'https://trackfield.vtexassets.com/';

    // Usado só na pré-visualização local, fora do Apps Script (dados reais do site).
    var AMOSTRA_CONSULTA = [
      { nome: 'Camiseta Masculina Manga Curta Sports', referencia: 'TF041024-0003', modelo: 'TF041024', corCodigo: '0003', corNome: 'Preto', corHex: '#000000', tamanho: 'PP', ean: '7909563108891', imagem: 'https://trackfield.vtexassets.com/arquivos/ids/677935-400-559', link: 'https://www.tf.com.br/camiseta-masculina-manga-curta-sports-preto-tf041024/p', preco: 239.9, precoCheio: 239.9, disponivel: true },
      { nome: 'Garrafa Mix 500ml', referencia: 'TFA210047-2627', modelo: 'TFA210047', corCodigo: '2627', corNome: 'Hibisco', corHex: '#E54D68', tamanho: 'UNICO', ean: '7909563184574', imagem: 'https://trackfield.vtexassets.com/arquivos/ids/312861-400-559', link: 'https://www.tf.com.br/garrafa-termica-mix-500ml-hibisco/p', preco: 129.9, precoCheio: 179.9, disponivel: true }
    ];

    var $ = function (id) { return document.getElementById(id); };
    var dialogo = $('consulta'), form = $('consultaForm'), campo = $('consultaCampo');
    var status = $('consultaStatus'), lista = $('resultados'), foto = $('fotoCodigo');
    var reais = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
    var pedido = 0;
    var detector = null;

    function el(tag, classe, texto) {
      var n = document.createElement(tag);
      if (classe) n.className = classe;
      if (texto != null) n.textContent = texto;
      return n;
    }

    function avisar(texto, erro) {
      status.textContent = texto;
      status.classList.toggle('erro', !!erro);
    }

    function abrir() {
      if (!dialogo.open) dialogo.showModal();
      campo.focus();
      campo.select();
    }

    // No Apps Script a busca vai ao servidor; fora dele (pré-visualização) usa a amostra.
    function consultarServidor(termo) {
      if (window.google && google.script && google.script.run) {
        return new Promise(function (ok, falha) {
          google.script.run.withSuccessHandler(ok).withFailureHandler(falha).buscarProduto(termo);
        });
      }
      var t = termo.toLowerCase();
      return Promise.resolve({ consulta: termo, produtos: AMOSTRA_CONSULTA.filter(function (p) {
        return (p.nome + ' ' + p.referencia + ' ' + p.ean).toLowerCase().indexOf(t) >= 0;
      }) });
    }

    function buscar(termo) {
      termo = String(termo || '').trim();
      if (termo.length < 2) { avisar('Digite pelo menos 2 caracteres.', true); campo.focus(); return; }
      var meu = ++pedido;
      lista.textContent = '';
      lista.setAttribute('aria-busy', 'true');
      avisar('Buscando "' + termo + '" no site da Track&Field…');
      consultarServidor(termo).then(function (r) {
        if (meu !== pedido) return;
        mostrar(r, termo);
      }, function (e) {
        if (meu !== pedido) return;
        avisar((e && e.message) || 'Não foi possível consultar agora. Tente de novo.', true);
      }).then(function () { if (meu === pedido) lista.removeAttribute('aria-busy'); });
    }

    function mostrar(r, termo) {
      var produtos = (r && r.produtos) || [];
      if (!produtos.length) {
        avisar('Nada encontrado para "' + termo + '". Confira o código ou tente parte do nome.', true);
        return;
      }
      avisar(produtos.length === 1 ? '1 produto encontrado.' : produtos.length + ' produtos encontrados.');
      produtos.forEach(function (p) { lista.appendChild(cartao(p)); });
    }

    function cartao(p) {
      var li = el('li', 'produto-consulta');
      var img = el('img');
      img.alt = p.nome;
      img.loading = 'lazy';
      img.decoding = 'async';
      if (String(p.imagem).indexOf(IMAGENS) === 0) img.src = p.imagem;
      li.appendChild(img);

      var corpo = el('div');
      corpo.appendChild(el('h3', null, p.nome));
      var ficha = el('p', 'ficha');
      ficha.appendChild(document.createTextNode(p.modelo || p.referencia));
      if (p.corCodigo || p.corNome) {
        ficha.appendChild(document.createTextNode(' · '));
        var cor = el('span', 'cor');
        if (/^#[0-9a-f]{6}$/i.test(p.corHex)) {
          var amostra = el('span', 'amostra-cor');
          amostra.style.background = p.corHex;
          amostra.setAttribute('aria-hidden', 'true');
          cor.appendChild(amostra);
        }
        cor.appendChild(document.createTextNode('Cor ' + [p.corCodigo, p.corNome].filter(Boolean).join(' ')));
        ficha.appendChild(cor);
      }
      // Tamanho e EAN só vêm na busca por código de barras: o EAN é de um tamanho só.
      if (p.tamanho) {
        ficha.appendChild(document.createTextNode(' · Tam. ' + (p.tamanho === 'UNICO' ? 'Único' : p.tamanho)));
        if (p.ean) { ficha.appendChild(el('br')); ficha.appendChild(document.createTextNode('EAN ' + p.ean)); }
      }
      corpo.appendChild(ficha);

      var precos = el('div', 'precos');
      var temDesconto = p.precoCheio - p.preco > 0.009 && p.preco > 0;
      if (p.preco > 0) precos.appendChild(el('span', 'preco', reais.format(p.preco)));
      if (temDesconto) {
        var cheio = el('span', 'preco-cheio');
        var riscado = el('s', null, reais.format(p.precoCheio));
        cheio.appendChild(document.createTextNode('de '));
        cheio.appendChild(riscado);
        precos.appendChild(cheio);
        precos.appendChild(el('span', 'selo', '−' + Math.round((1 - p.preco / p.precoCheio) * 100) + '%'));
      }
      if (!p.disponivel) precos.appendChild(el('span', 'selo esgotado', 'Esgotado no site'));
      corpo.appendChild(precos);

      if (String(p.link).indexOf(SITE) === 0) {
        var a = el('a', 'ver-site', 'Ver no site');
        a.href = p.link;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        corpo.appendChild(a);
      }
      li.appendChild(corpo);
      return li;
    }

    // ------------------------------------------------------------ código de barras pela foto
    // O Apps Script abre a página num iframe sem permissão de câmera ao vivo, então o celular
    // tira uma foto (input com capture) e a página lê o código da imagem.

    function criarDetector() {
      if (detector) return detector;
      detector = (function () {
        if ('BarcodeDetector' in window) {
          return window.BarcodeDetector.getSupportedFormats().then(function (suportados) {
            var formatos = FORMATOS.filter(function (f) { return suportados.indexOf(f) >= 0; });
            if (formatos.indexOf('ean_13') >= 0) return new window.BarcodeDetector({ formats: formatos });
            throw new Error('sem EAN');
          });
        }
        return Promise.reject(new Error('sem BarcodeDetector'));
      })().catch(function () {
        return import(LIB_LEITOR).then(function (lib) { return new lib.BarcodeDetector({ formats: FORMATOS }); });
      });
      detector.catch(function () { detector = null; });
      return detector;
    }

    // Fotos de celular são grandes: reduz para no máximo 1600 px antes de procurar o código.
    function imagemReduzida(arquivo) {
      return new Promise(function (ok, falha) {
        var url = URL.createObjectURL(arquivo);
        var img = new Image();
        img.onload = function () {
          var escala = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
          var tela = document.createElement('canvas');
          tela.width = Math.round(img.naturalWidth * escala);
          tela.height = Math.round(img.naturalHeight * escala);
          tela.getContext('2d').drawImage(img, 0, 0, tela.width, tela.height);
          URL.revokeObjectURL(url);
          ok(tela);
        };
        img.onerror = function () { URL.revokeObjectURL(url); falha(new Error('Não consegui abrir a foto.')); };
        img.src = url;
      });
    }

    function lerFoto(arquivo) {
      lista.textContent = '';
      avisar('Lendo o código de barras da foto…');
      Promise.all([criarDetector(), imagemReduzida(arquivo)]).then(function (r) {
        return r[0].detect(r[1]);
      }).then(function (codigos) {
        var codigo = (codigos || []).map(function (c) { return c.rawValue; })
          .filter(function (v) { return /^\d{8,14}$/.test(v); })[0] || (codigos[0] && codigos[0].rawValue);
        if (!codigo) {
          avisar('Não achei um código de barras na foto. Tire de novo, com o código inteiro, reto e nítido.', true);
          return;
        }
        campo.value = codigo;
        buscar(codigo);
      }).catch(function (e) {
        avisar(e && /foto/.test(e.message) ? e.message : 'Não foi possível ler a foto agora. Digite o código.', true);
      });
    }

    // ------------------------------------------------------------ eventos

    $('abrirConsulta').addEventListener('click', abrir);
    $('fecharConsulta').addEventListener('click', function () { dialogo.close(); });
    dialogo.addEventListener('click', function (e) { if (e.target === dialogo) dialogo.close(); });
    form.addEventListener('submit', function (e) { e.preventDefault(); buscar(campo.value); });
    $('fotografar').addEventListener('click', function () { foto.value = ''; foto.click(); });
    foto.addEventListener('change', function () { if (foto.files && foto.files[0]) lerFoto(foto.files[0]); });
    // "/" abre a consulta (fora de campos de texto), como em muitos sites.
    document.addEventListener('keydown', function (e) {
      if (e.key === '/' && !dialogo.open && !e.target.closest('input, textarea')) { e.preventDefault(); abrir(); }
    });
  })();
  </script>
</body>
</html>
