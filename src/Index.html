<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>Hub Track&amp;Field</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: grid;
      grid-template-rows: clamp(68px, 14vh, 128px) 1fr;
      background: #b3aca2;
      color: #1f2740;
      font-family: "Outfit", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .fachada {
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(180deg, rgb(255 236 210 / .14), rgb(0 0 0 / .22)),
        repeating-linear-gradient(90deg, #a0714a 0 2px, #8b5e3c 2px 8px, #6f4a2e 8px 10px, #4f321e 10px 12px);
      box-shadow: inset 0 -14px 22px -14px rgb(0 0 0 / .55);
    }
    .letreiro {
      margin: 0;
      font-size: clamp(30px, 5.4vh + 1vw, 66px);
      font-weight: 500;
      letter-spacing: -.015em;
      color: #fff;
      text-shadow: 0 0 2px #fff, 0 0 14px rgb(255 250 240 / .7), 0 0 36px rgb(255 232 196 / .45);
    }
    main { display: grid; place-items: center; padding: 24px 16px; }
    .cartao {
      max-width: 460px;
      padding: 32px 28px;
      border-radius: 22px;
      background: #faf8f4;
      text-align: center;
      box-shadow: 0 30px 80px -40px rgb(20 16 12 / .6);
    }
    h1 { margin: 0 0 10px; font-size: 28px; font-weight: 500; letter-spacing: -.02em; }
    p { margin: 0 0 22px; font-size: 17px; font-weight: 300; line-height: 1.5; color: #4e5569; }
    a.abrir {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 28px;
      border-radius: 999px;
      background: #1f2740;
      color: #fff;
      font-size: 17px;
      font-weight: 500;
      text-decoration: none;
    }
    a.abrir:focus-visible { outline: 2px solid #1f2740; outline-offset: 3px; }
    .endereco { margin: 18px 0 0; font-size: 14px; word-break: break-all; }
  </style>
</head>
<body>
  <header class="fachada"><p class="letreiro">Track&amp;Field</p></header>
  <main>
    <div class="cartao">
      <h1>O Hub mudou de endereço</h1>
      <p>A nova versão tem a lupa com leitor de código de barras ao vivo e a soma de produtos. Salve o endereço novo nos favoritos.</p>
      <a class="abrir" href="https://lucasfranco-dev.github.io/hub-trackfield/">Abrir o Hub</a>
      <p class="endereco">lucasfranco-dev.github.io/hub-trackfield</p>
    </div>
  </main>
</body>
</html>
