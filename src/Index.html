<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hub Track&amp;Field</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://trackfield.vtexassets.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ripado: #8b5e3c;
      --ripado-claro: #a0714a;
      --ripado-escuro: #4f321e;
      --moldura: #b3aca2;
      --moldura-escura: #958e84;
      --parede: #f3f3f0;
      --piso: #b88f64;
      --piso-junta: #9a7350;
      --madeira-cubo: #c9a073;
      --madeira-topo: #dcbb93;
      --noturno: #1f2740;
      --noturno-suave: #565d72;
      --luz: 255 243 220;
      --fonte: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
      --curva-camera: cubic-bezier(.62, .02, .24, 1);
      --tempo-camera: 950ms;
      --chao: 15%;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--moldura);
      color: var(--noturno);
      font-family: var(--fonte);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      overscroll-behavior: none;
    }
    button { font: inherit; color: inherit; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    .loja {
      height: 100vh;
      height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      grid-template-columns: minmax(0, 1fr);
    }

    /* Fachada: ripado de madeira com o letreiro iluminado */
    .fachada {
      position: relative;
      height: clamp(68px, 14vh, 128px);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 clamp(20px, 4.5vw, 64px);
      background:
        linear-gradient(180deg, rgb(255 236 210 / .14), rgb(0 0 0 / .22)),
        repeating-linear-gradient(90deg,
          var(--ripado-claro) 0 2px, var(--ripado) 2px 8px,
          #6f4a2e 8px 10px, var(--ripado-escuro) 10px 12px);
      box-shadow: inset 0 -14px 22px -14px rgb(0 0 0 / .55);
    }
    .letreiro {
      margin: 0;
      font-weight: 500;
      font-size: clamp(30px, 5.4vh + 1vw, 66px);
      letter-spacing: -.015em;
      line-height: 1;
      color: #cfb9a2;
      text-shadow: 0 2px 0 rgb(40 24 12 / .35);
      transition: color .5s ease, text-shadow .9s ease;
      user-select: none;
    }
    .acesa .letreiro {
      color: #fff;
      text-shadow:
        0 2px 0 rgb(40 24 12 / .25),
        0 0 2px #fff,
        0 0 14px rgb(255 250 240 / .7),
        0 0 36px rgb(255 232 196 / .45);
    }

    /* Moldura cinza da vitrine */
    .moldura {
      min-height: 0;
      padding: 10px clamp(8px, 2.2vw, 30px) 0;
      background: linear-gradient(180deg, var(--moldura-escura), var(--moldura) 30px);
    }

    .vitrine {
      --i: 0;
      --baia: 600px;
      --meio: 400px;
      position: relative;
      height: 100%;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgb(255 255 255 / .9), rgb(255 255 255 / 0) 9%),
        linear-gradient(180deg, #caa47b, var(--piso) 40%, var(--piso-junta)) left bottom / 100% var(--chao) no-repeat,
        var(--parede);
      touch-action: pan-y;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
    }
    .vitrine.arrastando { cursor: grabbing; }

    .camada {
      position: absolute;
      inset: 0 auto 0 0;
      display: flex;
      height: 100%;
      transform: translate3d(calc(var(--meio) - (var(--i) + .5) * var(--baia) * var(--f)), 0, 0);
      transition: transform var(--tempo-camera) var(--curva-camera);
      will-change: transform;
    }
    .arrastando .camada { transition: none; }
    .camada > * { flex: none; width: calc(var(--baia) * var(--f)); position: relative; height: 100%; }

    /* Fundo: parede com o logo em relevo, como nas lojas */
    .parede { --f: .72; }
    .parede-baia::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 1px;
      background: rgb(0 0 0 / .045);
    }
    .relevo {
      position: absolute;
      top: 5%;
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(30px, 4.6vw, 72px);
      font-weight: 500;
      letter-spacing: -.02em;
      white-space: nowrap;
      color: var(--parede);
      text-shadow: 1px 1px 1px rgb(0 0 0 / .07), -1px -1px 1px rgb(255 255 255 / .9);
    }

    /* Palco: piso, luz e produtos */
    .palco { --f: 1; }
    .palco-baia::after {
      content: "";
      position: absolute;
      inset: auto 0 0 0;
      height: var(--chao);
      background: repeating-linear-gradient(90deg, transparent 0 calc(var(--baia) / 4 - 2px), rgb(60 36 18 / .22) calc(var(--baia) / 4 - 2px) calc(var(--baia) / 4));
      box-shadow: 0 -1px 0 rgb(0 0 0 / .12);
    }
    .spot {
      position: absolute;
      inset: 0 0 0 0;
      background:
        radial-gradient(ellipse 30% 85% at var(--x) 0%, rgb(var(--luz) / .85), rgb(var(--luz) / 0) 75%),
        radial-gradient(ellipse 26% 5% at var(--x) calc(100% - var(--chao) + 1%), rgb(var(--luz) / .9), rgb(var(--luz) / 0) 100%);
      opacity: 0;
      transition: opacity .5s ease;
      pointer-events: none;
      z-index: 0;
      mix-blend-mode: screen;
    }
    .acesa .ativa .spot { opacity: 1; transition-delay: calc(var(--tempo-camera) * .55); }

    .produto {
      position: absolute;
      left: var(--x);
      bottom: calc(var(--chao) - 1%);
      transform: translateX(-50%);
      display: block;
      z-index: 1;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    .produto img {
      display: block;
      height: 100%;
      width: auto;
      aspect-ratio: 600 / 839;
      mix-blend-mode: multiply;
      -webkit-mask-image: radial-gradient(ellipse 50% 52% at 50% 46%, #000 58%, transparent 100%);
      mask-image: radial-gradient(ellipse 50% 52% at 50% 46%, #000 58%, transparent 100%);
      /* Clareia o fundo cinza da foto para ele sumir na parede. */
      filter: brightness(1.07) contrast(1.08);
      transition: filter .5s ease;
      -webkit-user-drag: none;
    }
    .palco-baia:not(.ativa) .produto img { filter: brightness(1.04) contrast(1.04) saturate(.6); }
    .manequim .produto { height: 76%; }
    .cubo .produto { height: 72%; }
    .cubo .produto { display: flex; flex-direction: column; justify-content: flex-end; }
    .cubo .produto img {
      height: 66%;
      margin: 0 auto;
      position: relative;
      z-index: 1;
      /* A foto tem respiro embaixo; desce a mala até o tampo do cubo. */
      transform: translateY(20%);
    }
    .bloco {
      position: relative;
      flex: none;
      height: 34%;
      aspect-ratio: 1.15 / 1;
      margin: 0 auto;
      background:
        linear-gradient(180deg, var(--madeira-topo) 0 11%, rgb(0 0 0 / .12) 11% 12%, rgb(255 255 255 / .06) 12% 20%, transparent 20% 82%, rgb(0 0 0 / .08)),
        repeating-linear-gradient(90deg, rgb(0 0 0 / 0) 0 11px, rgb(110 70 35 / .08) 11px 12px),
        linear-gradient(90deg, #b88d60, var(--madeira-cubo) 30%, #bb9064);
      box-shadow: 0 18px 20px -14px rgb(60 36 18 / .5);
    }
    .sombra {
      position: absolute;
      left: 50%;
      bottom: -3%;
      width: 70%;
      height: 6%;
      transform: translateX(-50%);
      background: radial-gradient(ellipse at center, rgb(40 25 12 / .28), transparent 70%);
      z-index: -1;
    }
    .produto:focus-visible img { outline: 2px solid var(--noturno); outline-offset: 6px; }

    /* Vidro: adesivos com o nome de cada link, mais próximos da câmera */
    .vidro { --f: 1.22; pointer-events: none; z-index: 3; }
    .adesivo {
      position: absolute;
      left: 9%;
      top: 50%;
      width: 40%;
      transform: translateY(-58%);
      opacity: 0;
      transition: opacity .3s ease;
    }
    .vidro-baia.ativa .adesivo {
      opacity: 1;
      transition: opacity .55s ease calc(var(--tempo-camera) * .5);
      pointer-events: auto;
    }
    .categoria {
      margin: 0 0 10px;
      font-size: 15px;
      font-weight: 500;
      color: var(--noturno-suave);
    }
    .nome {
      margin: 0;
      font-size: clamp(32px, 3.6vw, 60px);
      font-weight: 500;
      line-height: 1.02;
      letter-spacing: -.025em;
      text-wrap: balance;
    }
    .descricao {
      margin: 14px 0 26px;
      max-width: 30ch;
      font-size: 17px;
      font-weight: 300;
      line-height: 1.45;
      color: var(--noturno-suave);
    }
    .abrir {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 48px;
      padding: 0 24px;
      border-radius: 999px;
      background: var(--noturno);
      color: #fff;
      font-size: 16px;
      font-weight: 500;
      text-decoration: none;
      transition: background-color .2s ease, transform .2s ease;
    }
    .abrir svg { width: 14px; height: 14px; transition: transform .2s ease; }
    .abrir:active { transform: scale(.97); }
    .abrir:focus-visible { outline: 2px solid var(--noturno); outline-offset: 3px; }
    @media (hover: hover) {
      .abrir:hover { background: #2d3758; }
      .abrir:hover svg { transform: translate(2px, -2px); }
    }

    .reflexo {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      background:
        linear-gradient(105deg, transparent 0 38%, rgb(255 255 255 / .16) 41%, transparent 47%, transparent 52%, rgb(255 255 255 / .08) 54%, transparent 58%),
        linear-gradient(180deg, rgb(20 16 12 / .10), transparent 18%);
    }
    .apagado {
      position: absolute;
      inset: 0;
      z-index: 5;
      background: rgb(28 22 17 / .62);
      pointer-events: none;
      transition: opacity .8s ease .25s;
    }
    .acesa .apagado { opacity: 0; }

    .seta {
      position: absolute;
      top: 50%;
      z-index: 6;
      width: 52px;
      height: 52px;
      margin-top: -26px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: rgb(255 255 255 / .62);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      box-shadow: 0 1px 0 rgb(255 255 255 / .8) inset, 0 6px 18px -8px rgb(0 0 0 / .35);
      cursor: pointer;
      transition: background-color .2s ease, opacity .2s ease, transform .15s ease;
    }
    .seta svg { width: 18px; height: 18px; }
    .seta:active { transform: scale(.94); }
    .seta:focus-visible { outline: 2px solid var(--noturno); outline-offset: 2px; }
    .seta[disabled] { opacity: 0; pointer-events: none; }
    .seta.anterior { left: 18px; }
    .seta.proxima { right: 18px; }
    @media (hover: hover) { .seta:hover { background: rgb(255 255 255 / .9); } }

    .aviso {
      position: absolute;
      inset: 0;
      z-index: 6;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      font-size: 18px;
      color: var(--noturno-suave);
    }
    .aviso strong { display: block; color: var(--noturno); font-weight: 500; font-size: 22px; margin-bottom: 6px; }

    /* Soleira: índice de todos os links */
    .soleira {
      display: flex;
      align-items: center;
      gap: 24px;
      min-height: 64px;
      padding: 8px clamp(16px, 2.2vw, 30px) calc(8px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, #a59e94, var(--moldura) 8px);
    }
    .soleira-titulo {
      flex: none;
      margin: 0;
      font-size: 14px;
      font-weight: 500;
      color: #4a4741;
    }
    .indice {
      display: flex;
      gap: 4px;
      margin: 0;
      padding: 0;
      list-style: none;
      overflow-x: auto;
      scrollbar-width: none;
      flex: 1;
      min-width: 0;
    }
    .indice::-webkit-scrollbar { display: none; }
    .indice button {
      position: relative;
      min-height: 44px;
      padding: 0 14px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #46433d;
      font-size: 15px;
      white-space: nowrap;
      cursor: pointer;
      transition: color .2s ease, background-color .2s ease;
    }
    .indice button::after {
      content: "";
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 6px;
      height: 2px;
      border-radius: 2px;
      background: var(--noturno);
      transform: scaleX(0);
      transition: transform .35s var(--curva-camera);
    }
    .indice button[aria-current="true"] { color: var(--noturno); font-weight: 500; }
    .indice button[aria-current="true"]::after { transform: scaleX(1); }
    .indice button:focus-visible { outline: 2px solid var(--noturno); outline-offset: -2px; }
    @media (hover: hover) { .indice button:hover { background: rgb(255 255 255 / .25); } }
    .contador {
      flex: none;
      margin: 0;
      font-size: 14px;
      color: #4a4741;
      font-variant-numeric: tabular-nums;
    }

    /* Celular */
    @media (max-width: 720px) {
      .fachada { justify-content: center; }
      .seta, .soleira-titulo, .contador, .relevo { display: none; }
      .soleira { padding-inline: 8px; }
      .adesivo {
        inset: 5% 9% 5% 9%;
        width: auto;
        transform: none;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        pointer-events: none;
      }
      .vidro-baia.ativa .adesivo { pointer-events: none; }
      .vidro-baia.ativa .abrir { pointer-events: auto; }
      .nome { font-size: clamp(28px, 8.4vw, 38px); }
      .categoria { margin-bottom: 6px; font-size: 14px; }
      .descricao { margin: 8px 0 0; font-size: 15px; }
      .abrir { margin-top: auto; align-self: stretch; justify-content: center; min-height: 52px; }
      .manequim .produto { height: 56%; }
      .cubo .produto { height: 54%; }
      :root { --chao: 22%; }
    }

    @media (prefers-reduced-motion: reduce) {
      :root { --tempo-camera: 0ms; }
      .letreiro, .apagado, .spot, .adesivo, .abrir, .indice button::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <script type="application/json" id="dados"><?!= dadosJson ?></script>

  <div class="loja" id="loja">
    <header class="fachada">
      <h1 class="sr-only">Hub da equipe Track&amp;Field</h1>
      <p class="letreiro" aria-hidden="true">Track&amp;Field</p>
    </header>

    <div class="moldura">
      <main class="vitrine" id="vitrine" aria-roledescription="carrossel" aria-label="Links da equipe">
        <div class="camada parede" id="parede" aria-hidden="true"></div>
        <div class="camada palco" id="palco"></div>
        <div class="camada vidro" id="vidro"></div>
        <div class="reflexo" aria-hidden="true"></div>
        <div class="apagado" aria-hidden="true"></div>
        <button class="seta anterior" id="anterior" type="button" aria-label="Link anterior">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <button class="seta proxima" id="proxima" type="button" aria-label="Próximo link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </main>
    </div>

    <nav class="soleira" aria-label="Todos os links">
      <p class="soleira-titulo">Hub da equipe</p>
      <ol class="indice" id="indice"></ol>
      <p class="contador" id="contador" aria-hidden="true"></p>
    </nav>
    <p class="sr-only" aria-live="polite" id="anuncio"></p>
  </div>

  <script>
  (function () {
    'use strict';

    // Usado só na pré-visualização local, fora do Apps Script.
    var AMOSTRA = [
      { nome: 'Sistema de vendas', categoria: 'Vendas', descricao: 'Pedidos, trocas e vendas do dia.', url: 'https://example.com/vendas', produto: 'Casaco PowerCool', expositor: 'Manequim', imagem: 'https://trackfield.vtexassets.com/arquivos/ids/397887' },
      { nome: 'Consulta de estoque', categoria: 'Estoque', descricao: 'Disponibilidade nesta loja e nas outras.', url: 'https://example.com/estoque', produto: 'Mala Duffel Matelassê', expositor: 'Cubo', imagem: 'https://trackfield.vtexassets.com/arquivos/ids/439405' },
      { nome: 'Escala e ponto', categoria: 'Equipe', descricao: 'Horários da semana e registro de ponto.', url: 'https://example.com/ponto', produto: 'Camiseta ThermoDry', expositor: 'Manequim', imagem: 'https://trackfield.vtexassets.com/arquivos/ids/672372' },
      { nome: 'Metas da loja', categoria: 'Resultados', descricao: 'Acompanhe as metas do dia e do mês.', url: 'https://example.com/metas', produto: 'Shorts Laser', expositor: 'Manequim', imagem: 'https://trackfield.vtexassets.com/arquivos/ids/400676' },
      { nome: 'Treinamentos', categoria: 'Aprendizado', descricao: 'Cursos sobre produtos e atendimento.', url: 'https://example.com/treinamentos', produto: 'Jaqueta Winter', expositor: 'Manequim', imagem: 'https://trackfield.vtexassets.com/arquivos/ids/574254' },
      { nome: 'Comunicados', categoria: 'Comunicação', descricao: 'Avisos da gestão e campanhas em vigor.', url: 'https://example.com/comunicados', produto: 'Mala Trip', expositor: 'Cubo', imagem: 'https://trackfield.vtexassets.com/arquivos/ids/536919' },
      { nome: 'Catálogo online', categoria: 'Produto', descricao: 'Toda a coleção no site oficial.', url: 'https://www.tf.com.br', produto: 'Camiseta Sports', expositor: 'Manequim', imagem: 'https://trackfield.vtexassets.com/arquivos/ids/677935' },
      { nome: 'Suporte', categoria: 'Ajuda', descricao: 'Abra um chamado para TI ou manutenção.', url: 'https://example.com/suporte', produto: 'Garrafa Urban 950 ml', expositor: 'Cubo', imagem: 'https://trackfield.vtexassets.com/arquivos/ids/367085' }
    ];

    var loja = document.getElementById('loja');
    var vitrine = document.getElementById('vitrine');
    var parede = document.getElementById('parede');
    var palco = document.getElementById('palco');
    var vidro = document.getElementById('vidro');
    var indice = document.getElementById('indice');
    var contador = document.getElementById('contador');
    var anuncio = document.getElementById('anuncio');
    var btnAnterior = document.getElementById('anterior');
    var btnProxima = document.getElementById('proxima');

    var dados = lerDados();
    var links = Array.isArray(dados) ? dados : (dados.links || []);
    var atual = 0;
    var baia = 0;
    var celular = false;

    function lerDados() {
      try {
        return JSON.parse(document.getElementById('dados').textContent);
      } catch (e) {
        return AMOSTRA;
      }
    }

    function urlSegura(url) {
      return /^https?:\/\//i.test(String(url || '')) ? url : null;
    }

    // Fotos da VTEX aceitam tamanho no caminho: .../ids/123-600-839
    function srcDaFoto(url, largura) {
      var m = /^(.*\/arquivos\/ids\/\d+)(?:-\d+-\d+)?(?:\/.*)?$/.exec(url || '');
      if (!m) return url;
      return m[1] + '-' + largura + '-' + Math.round(largura * 839 / 600);
    }

    function el(tag, classe, texto) {
      var n = document.createElement(tag);
      if (classe) n.className = classe;
      if (texto) n.textContent = texto;
      return n;
    }

    var ICONE_ABRIR = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 11L11 5M6 5h5v5"/></svg>';

    function montar() {
      if (dados && dados.erro) return mostrarAviso('Não foi possível ler a planilha', dados.erro);
      if (!links.length) return mostrarAviso('Nenhum link ativo', 'Marque a coluna Ativo na planilha para exibir os links aqui.');

      links.forEach(function (link, i) {
        var url = urlSegura(link.url);
        var cubo = String(link.expositor || '').toLowerCase() === 'cubo';

        var p = el('div', 'parede-baia');
        if (i % 3 === 1) p.appendChild(el('span', 'relevo', 'Track&Field'));
        parede.appendChild(p);

        var baiaPalco = el('div', 'palco-baia ' + (cubo ? 'cubo' : 'manequim'));
        baiaPalco.dataset.i = i;
        baiaPalco.appendChild(el('div', 'spot'));
        var produto = el('a', 'produto');
        if (url) { produto.href = url; produto.target = '_blank'; produto.rel = 'noopener noreferrer'; }
        produto.tabIndex = -1;
        produto.setAttribute('aria-hidden', 'true');
        produto.draggable = false;
        if (link.imagem) {
          var img = el('img');
          img.alt = '';
          img.draggable = false;
          img.decoding = 'async';
          img.src = srcDaFoto(link.imagem, 600);
          img.srcset = srcDaFoto(link.imagem, 600) + ' 600w, ' + srcDaFoto(link.imagem, 800) + ' 800w, ' + srcDaFoto(link.imagem, 1200) + ' 1200w';
          img.sizes = '(max-width: 720px) 70vw, 34vw';
          if (i === 0) img.setAttribute('fetchpriority', 'high');
          produto.appendChild(img);
        }
        if (cubo) produto.appendChild(el('div', 'bloco'));
        produto.appendChild(el('div', 'sombra'));
        baiaPalco.appendChild(produto);
        palco.appendChild(baiaPalco);

        var baiaVidro = el('div', 'vidro-baia');
        var adesivo = el('div', 'adesivo');
        adesivo.id = 'link-' + i;
        adesivo.setAttribute('role', 'group');
        adesivo.setAttribute('aria-roledescription', 'link');
        adesivo.setAttribute('aria-label', (i + 1) + ' de ' + links.length);
        if (link.categoria) adesivo.appendChild(el('p', 'categoria', link.categoria));
        adesivo.appendChild(el('h2', 'nome', link.nome));
        if (link.descricao) adesivo.appendChild(el('p', 'descricao', link.descricao));
        if (url) {
          var abrir = el('a', 'abrir');
          abrir.href = url;
          abrir.target = '_blank';
          abrir.rel = 'noopener noreferrer';
          abrir.textContent = 'Abrir';
          abrir.insertAdjacentHTML('beforeend', ICONE_ABRIR);
          abrir.setAttribute('aria-label', 'Abrir ' + link.nome + ' em nova aba');
          adesivo.appendChild(abrir);
        }
        baiaVidro.appendChild(adesivo);
        vidro.appendChild(baiaVidro);

        var li = el('li');
        var b = el('button', null, link.nome);
        b.type = 'button';
        b.addEventListener('click', function () { irPara(i); });
        li.appendChild(b);
        indice.appendChild(li);
      });

      medir();
      irPara(0, true);
      ligarEventos();
    }

    function mostrarAviso(titulo, texto) {
      var aviso = el('div', 'aviso');
      var caixa = el('div');
      caixa.appendChild(el('strong', null, titulo));
      caixa.appendChild(document.createTextNode(texto));
      aviso.appendChild(caixa);
      vitrine.appendChild(aviso);
      btnAnterior.disabled = true;
      btnProxima.disabled = true;
      acender();
    }

    function medir() {
      var largura = vitrine.clientWidth;
      celular = largura <= 720;
      baia = Math.round(largura * (celular ? 0.86 : 0.7));
      vitrine.style.setProperty('--baia', baia + 'px');
      vitrine.style.setProperty('--meio', Math.round(largura / 2) + 'px');
      // Produto à direita do adesivo no computador; centralizado no celular.
      vitrine.style.setProperty('--x', celular ? '50%' : '66%');
    }

    function irPara(i, inicial) {
      var total = links.length;
      i = Math.max(0, Math.min(total - 1, i));
      var mudou = i !== atual;
      atual = i;
      vitrine.style.setProperty('--i', i);

      Array.prototype.forEach.call(palco.children, function (n, k) { n.classList.toggle('ativa', k === i); });
      Array.prototype.forEach.call(vidro.children, function (n, k) {
        var ativa = k === i;
        n.classList.toggle('ativa', ativa);
        n.firstChild.setAttribute('aria-hidden', ativa ? 'false' : 'true');
        var a = n.querySelector('.abrir');
        if (a) a.tabIndex = ativa ? 0 : -1;
      });
      Array.prototype.forEach.call(indice.querySelectorAll('button'), function (b, k) {
        b.setAttribute('aria-current', k === i ? 'true' : 'false');
      });

      btnAnterior.disabled = i === 0;
      btnProxima.disabled = i === total - 1;
      contador.textContent = (i + 1) + ' de ' + total;
      centralizarIndice(inicial);
      if (mudou && !inicial) anuncio.textContent = links[i].nome + ', ' + (i + 1) + ' de ' + total;
    }

    function centralizarIndice(inicial) {
      var b = indice.querySelectorAll('button')[atual];
      if (!b) return;
      var alvo = b.offsetLeft - (indice.clientWidth - b.offsetWidth) / 2;
      indice.scrollTo({ left: alvo, behavior: inicial ? 'auto' : 'smooth' });
    }

    function abrirAtual() {
      var a = vidro.children[atual] && vidro.children[atual].querySelector('.abrir');
      if (a) a.click();
    }

    function ligarEventos() {
      btnAnterior.addEventListener('click', function () { irPara(atual - 1); });
      btnProxima.addEventListener('click', function () { irPara(atual + 1); });

      document.addEventListener('keydown', function (e) {
        if (e.altKey || e.ctrlKey || e.metaKey) return;
        if (e.key === 'ArrowRight') { irPara(atual + 1); e.preventDefault(); }
        else if (e.key === 'ArrowLeft') { irPara(atual - 1); e.preventDefault(); }
        else if (e.key === 'Home') { irPara(0); e.preventDefault(); }
        else if (e.key === 'End') { irPara(links.length - 1); e.preventDefault(); }
        else if (/^[1-9]$/.test(e.key)) irPara(Number(e.key) - 1);
        else if (e.key === 'Enter' && (e.target === document.body || e.target === vitrine)) abrirAtual();
      });

      // Roda do mouse ou trackpad: um passo por gesto.
      var acumulado = 0, travadoAte = 0;
      vitrine.addEventListener('wheel', function (e) {
        e.preventDefault();
        var agora = Date.now();
        if (agora < travadoAte) return;
        acumulado += Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
        if (Math.abs(acumulado) > 40) {
          irPara(atual + (acumulado > 0 ? 1 : -1));
          acumulado = 0;
          travadoAte = agora + 650;
        }
      }, { passive: false });

      // Arrastar com dedo ou mouse: a vitrine acompanha o gesto.
      var inicioX = null, inicioY = 0, deslocamento = 0, arrastando = false, inicioT = 0, idPonteiro = null;
      vitrine.addEventListener('pointerdown', function (e) {
        if (e.button !== 0 || e.target.closest('.seta, .abrir')) return;
        inicioX = e.clientX; inicioY = e.clientY; deslocamento = 0; arrastando = false;
        inicioT = performance.now(); idPonteiro = e.pointerId;
      });
      vitrine.addEventListener('pointermove', function (e) {
        if (inicioX === null || e.pointerId !== idPonteiro) return;
        var dx = e.clientX - inicioX;
        if (!arrastando) {
          if (Math.abs(dx) < 8 || Math.abs(dx) < Math.abs(e.clientY - inicioY)) return;
          arrastando = true;
          vitrine.classList.add('arrastando');
          vitrine.setPointerCapture(idPonteiro);
        }
        var limite = (atual === 0 && dx > 0) || (atual === links.length - 1 && dx < 0);
        deslocamento = limite ? dx / 3 : dx;
        vitrine.style.setProperty('--i', atual - deslocamento / baia);
      });
      function soltar(e) {
        if (inicioX === null || e.pointerId !== idPonteiro) return;
        if (arrastando) {
          vitrine.classList.remove('arrastando');
          var velocidade = deslocamento / Math.max(1, performance.now() - inicioT);
          var passo = (Math.abs(deslocamento) > baia * 0.18 || Math.abs(velocidade) > 0.5) ? (deslocamento < 0 ? 1 : -1) : 0;
          irPara(atual + passo);
          if (passo === 0) vitrine.style.setProperty('--i', atual);
          var cancelarClique = function (ev) { ev.preventDefault(); ev.stopPropagation(); };
          vitrine.addEventListener('click', cancelarClique, { capture: true, once: true });
          setTimeout(function () { vitrine.removeEventListener('click', cancelarClique, { capture: true }); }, 0);
        }
        inicioX = null; arrastando = false;
      }
      vitrine.addEventListener('pointerup', soltar);
      vitrine.addEventListener('pointercancel', soltar);

      // Clicar num produto vizinho leva até ele em vez de abrir o link.
      palco.addEventListener('click', function (e) {
        var b = e.target.closest('.palco-baia');
        if (!b) return;
        var i = Number(b.dataset.i);
        if (i !== atual) { e.preventDefault(); irPara(i); }
      });

      var timer;
      window.addEventListener('resize', function () {
        clearTimeout(timer);
        timer = setTimeout(function () {
          vitrine.classList.add('arrastando');
          medir();
          irPara(atual, true);
          requestAnimationFrame(function () { vitrine.classList.remove('arrastando'); });
        }, 80);
      });
    }

    function acender() {
      requestAnimationFrame(function () { loja.classList.add('acesa'); });
    }

    montar();

    // Acende a loja quando a primeira foto chega (ou depois de 600 ms, o que vier antes).
    var primeira = palco.querySelector('img');
    var acesa = false;
    function acenderUmaVez() { if (!acesa) { acesa = true; acender(); } }
    if (primeira && !primeira.complete) {
      primeira.addEventListener('load', acenderUmaVez);
      primeira.addEventListener('error', acenderUmaVez);
      setTimeout(acenderUmaVez, 600);
    } else {
      acenderUmaVez();
    }
  })();
  </script>
</body>
</html>
